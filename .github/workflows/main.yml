name: Build NOVA GPS PRO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests (theme contrast, GPS signal, existing suites)
        continue-on-error: true
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testDebugUnitTest 2>&1 | tee test.log

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee build.log

      - name: Report build failure
        if: failure()
        run: |
          echo "=== BUILD.LOG (last 400 lines) ==="
          tail -n 400 build.log || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 400 build.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Push build log to branch on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          # create orphan branch with build log
          git checkout --orphan ci-build-log || git checkout -B ci-build-log
          # keep only build.log
          cp ../build.log ./build-failure.log 2>/dev/null || cp build.log ./build-failure.log || true
          if [ ! -f build-failure.log ]; then echo "no build.log" > build-failure.log; fi
          git add build-failure.log || true
          git commit -m "build failure log for ${{ github.sha }}" || true
          git push origin ci-build-log --force || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-GPS-PRO-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

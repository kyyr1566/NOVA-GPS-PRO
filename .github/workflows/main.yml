name: Build NOVA GPS PRO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests (theme contrast, GPS signal, existing suites)
        continue-on-error: true
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testDebugUnitTest 2>&1 | tee test.log

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee build.log

      - name: Report build failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== BUILD.LOG (last 400 lines) ==="
          tail -n 400 build.log || true
          echo "=== posting to PR comment ==="
          # hardcode PR 9 for arena branch (open PR)
          PR=9
          LOGFILE=$(mktemp)
          tail -n 300 build.log > "$LOGFILE"
          # truncate to 60000 chars for comment limit
          head -c 60000 "$LOGFILE" > "${LOGFILE}.trunc"
          mv "${LOGFILE}.trunc" "$LOGFILE"
          if [ -s "$LOGFILE" ]; then
            gh pr comment "$PR" --body-file "$LOGFILE" || \
            gh api repos/${{ github.repository }}/issues/$PR/comments --field body="$(cat "$LOGFILE" | head -c 60000)" || true
          fi
          # also echo to step summary for visibility
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat "$LOGFILE" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-GPS-PRO-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

name: Build NOVA GPS PRO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests (onboarding, icons, theme, GPS, radar, portal, splash)
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testDebugUnitTest \
            --tests "com.nova.gpspro.OnboardingManagerTest" \
            --tests "com.nova.gpspro.ThemeSourceTest" \
            --tests "com.nova.gpspro.ThemeContrastTest" \
            --tests "com.nova.gpspro.SplashTimelineTest" \
            --tests "com.nova.gpspro.PortalLogicTest" \
            --tests "com.nova.gpspro.LocxCodecTest" \
            --tests "com.nova.gpspro.GpsSignalTest" \
            --tests "com.nova.gpspro.RadarPlotTest" \
            --tests "com.nova.gpspro.CardPositionFilterTest" \
            --tests "com.nova.gpspro.DestDistanceTest" \
            --tests "com.nova.gpspro.FitTest" \
            --tests "com.nova.gpspro.NavFitTest" \
            --tests "com.nova.gpspro.SpeedoModeTest" 2>&1 | tee test.log

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee build.log

      - name: Annotate failure diagnostics
        if: failure()
        run: |
          ERR=$(grep -E "e: |error:|FAILED|AssertionError|Exception|Caused by:" test.log build.log 2>/dev/null | head -n 12 | tr '\n' ' | ' | head -c 900)
          if [ -z "$ERR" ]; then ERR=$(tail -n 30 test.log build.log 2>/dev/null | tr '\n' ' | ' | head -c 900); fi
          echo "::error title=Diagnostics::$ERR"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-GPS-PRO-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

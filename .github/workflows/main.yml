name: Build NOVA GPS PRO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests (theme contrast, GPS signal, existing suites)
        continue-on-error: true
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testDebugUnitTest 2>&1 | tee test.log

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee build.log

      - name: Report build failure
        if: failure()
        run: |
          echo "=== BUILD.LOG (last 400 lines) ==="
          tail -n 400 build.log || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 400 build.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Push build log via API on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== pushing build.log via contents API ==="
          if [ -f build.log ]; then
            tail -n 500 build.log > /tmp/trunc.log
            B64=$(base64 -w0 /tmp/trunc.log)
            gh api --method PUT repos/${{ github.repository }}/contents/ci-logs/${{ github.sha }}.log \
              --field message="ci log for ${{ github.sha }}" \
              --field content="$B64" \
              --field branch="ci-build-log" || echo "contents API failed"
            cat /tmp/trunc.log
          else
            echo "no build.log found"
            ls -la
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-GPS-PRO-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

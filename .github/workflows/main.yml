name: Build NOVA GPS PRO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests (theme contrast, GPS signal, existing suites)
        continue-on-error: true
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testDebugUnitTest 2>&1 | tee test.log

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee build.log

      - name: Report build failure
        if: failure()
        run: |
          echo "=== BUILD.LOG (last 400 lines) ==="
          tail -n 400 build.log || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 400 build.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Post build log as PR comment
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('build.log', 'utf8'); } catch(e) { log = 'no build.log: ' + e.message; }
            log = log.slice(-55000);
            // truncate to 60000 for comment limit
            const body = '❌ Build failed for `' + context.sha.substring(0,7) + '`\n```\n' + log.slice(-50000) + '\n```';
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 9,
                body: body
              });
              core.info('posted comment');
            } catch(e) {
              core.warning('failed to post comment: ' + e.message);
              // also try to put as gist via API
              core.info(log.slice(-1000));
            }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-GPS-PRO-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

name: Build NOVA GPS PRO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests (theme contrast, GPS signal, existing suites)
        continue-on-error: true
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testDebugUnitTest 2>&1 | tee test.log

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee build.log

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            test.log
          if-no-files-found: warn

      - name: Create issue with build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Creating issue with build log..."
          TAIL=$(tail -n 300 build.log 2>/dev/null | head -c 40000)
          if [ -z "$TAIL" ]; then TAIL="(empty)"; fi
          BODY=$(printf "Build failed run %s sha %s\n\n\`\`\`\n%s\n\`\`\`" "${{ github.run_id }}" "${{ github.sha }}" "$TAIL")
          echo "$BODY" > /tmp/issue_body.txt
          head -n 50 /tmp/issue_body.txt
          gh issue create --title "Build log ${{ github.run_id }}" --body-file /tmp/issue_body.txt 2>&1 | head -n 20 || \
          gh api repos/${{ github.repository }}/issues -f title="Build log ${{ github.run_id }}" -F body=@/tmp/issue_body.txt 2>&1 | head -n 20 || true
          echo "done"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-GPS-PRO-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

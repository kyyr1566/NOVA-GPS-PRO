name: Build NOVA GPS PRO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests (theme contrast, GPS signal, existing suites)
        continue-on-error: true
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testDebugUnitTest 2>&1 | tee test.log

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee build.log

      - name: Upload build log on failure
        if: failure()
        run: |
          echo "=== build.log tail ==="
          tail -n 1000 build.log || true
          echo "=== END ==="

      - name: Post build log as commit comment
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('build.log', 'utf8'); } catch(e) { log = 'no build.log found'; }
            // Find compilation error section
            let snippet = '';
            const markers = ['e: ', 'error:', 'FAILED', 'Execution failed', 'Unresolved reference', 'Cannot resolve'];
            let idx = -1;
            for (const m of markers) {
              const i = log.indexOf(m);
              if (i !== -1) { idx = i; break; }
            }
            if (idx !== -1) {
              snippet = log.slice(Math.max(0, idx - 500), idx + 5500);
            } else {
              snippet = log.slice(-6000);
            }
            // Also try to get task failure
            const taskIdx = log.indexOf('> Task :app');
            if (taskIdx !== -1) {
              const taskSnippet = log.slice(taskIdx, taskIdx + 3000);
              snippet = taskSnippet + "\n---\n" + snippet;
            }
            snippet = snippet.slice(0, 6000);
            const body = "Build failed at `${{ github.sha }}` (run ${{ github.run_id }}):\n```\n" + snippet + "\n```";
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: body
            });

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-GPS-PRO-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

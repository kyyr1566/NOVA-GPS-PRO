name: Build NOVA GPS PRO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests (theme contrast, GPS signal, existing suites)
        continue-on-error: true
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testDebugUnitTest 2>&1 | tee test.log

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee build.log

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            test.log
          if-no-files-found: warn

      - name: Annotate build log on failure
        if: failure()
        run: |
          echo "Annotating build log..."
          echo "=== tail 400 ==="; tail -n 400 build.log 2>&1 | head -n 400
          echo "=== grep e: ==="; grep -E "e: |error:" build.log 2>&1 | head -n 60
          ERR=$(grep -E "e: |error:" build.log 2>&1 | head -n 5 | tr '\n' '; ' | head -c 900)
          if [ -z "$ERR" ]; then ERR=$(tail -n 80 build.log 2>&1 | tr '\n' '; ' | head -c 900); fi
          echo "::error file=app/src/main/java/com/nova/gpspro/ui/RadarView.kt,line=1,title=BuildError::$ERR"
          echo "### Build log tail" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 350 build.log >> $GITHUB_STEP_SUMMARY 2>&1 || echo "no log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "### Error lines" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "e: |error:" build.log 2>&1 | head -n 60 >> $GITHUB_STEP_SUMMARY || echo "no error grep" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-GPS-PRO-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

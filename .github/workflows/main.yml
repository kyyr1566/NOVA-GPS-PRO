name: Build NOVA GPS PRO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests (theme contrast, GPS signal, existing suites)
        continue-on-error: true
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testDebugUnitTest 2>&1 | tee test.log

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee build.log

      - name: Upload build log on failure
        if: failure()
        run: |
          echo "=== build.log tail ==="
          tail -n 500 build.log || true
          echo "=== gradle scan ==="
          find app/build -name "*.log" -exec tail -n 200 {} \; 2>/dev/null || true
          # Push log to repo via contents API (api.github.com is allowed in sandbox)
          if [ -f build.log ]; then
            B64=$(base64 -w 0 build.log | head -c 900000)
            curl -s -X PUT -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github.v3+json" https://api.github.com/repos/${{ github.repository }}/contents/build-log-${{ github.run_id }}.txt -d "{\"message\":\"build log ${{ github.run_id }}\",\"content\":\"$B64\",\"branch\":\"build-log-${{ github.run_id }}\"}" || echo "push log failed"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-GPS-PRO-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: Build RMG-GPS-Pro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests (testDebugUnitTest)
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testDebugUnitTest \
            --tests "com.nova.gpspro.OnboardingManagerTest" \
            --tests "com.nova.gpspro.ThemeSourceTest" \
            --tests "com.nova.gpspro.ThemeContrastTest" \
            --tests "com.nova.gpspro.SplashTimelineTest" \
            --tests "com.nova.gpspro.PortalLogicTest" \
            --tests "com.nova.gpspro.LocxCodecTest" \
            --tests "com.nova.gpspro.GpsSignalTest" \
            --tests "com.nova.gpspro.RadarPlotTest" \
            --tests "com.nova.gpspro.CardPositionFilterTest" \
            --tests "com.nova.gpspro.DestDistanceTest" \
            --tests "com.nova.gpspro.FitTest" \
            --tests "com.nova.gpspro.NavFitTest" \
            --tests "com.nova.gpspro.SpeedoModeTest" 2>&1 | tee test.log

      - name: Run Android Lint (lintDebug)
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace lintDebug 2>&1 | tee lint.log

      - name: Build Debug APK (assembleDebug) & verify non-zero APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee build.log
          SRC_APK="app/build/outputs/apk/debug/app-debug.apk"
          OUT_APK="app/build/outputs/apk/debug/RMG-GPS-Pro-debug.apk"
          test -f "$SRC_APK"
          cp -f "$SRC_APK" "$OUT_APK"
          SIZE=$(stat -c%s "$OUT_APK")
          echo "Generated APK: $OUT_APK (${SIZE} bytes)"
          if [ "$SIZE" -le 0 ]; then
            echo "ERROR: APK size is zero!"
            exit 1
          fi
          sha256sum "$OUT_APK"

      - name: Verify APK packaging and signature (aapt2 / apksigner / zipalign)
        run: |
          set -o pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          BUILD_TOOLS_DIR=$(ls -d "$SDK_ROOT"/build-tools/* 2>/dev/null | sort -V | tail -n 1)
          echo "Using build-tools: $BUILD_TOOLS_DIR"
          AAPT2="$BUILD_TOOLS_DIR/aapt2"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          APK="app/build/outputs/apk/debug/RMG-GPS-Pro-debug.apk"
          test -x "$AAPT2"; test -x "$APKSIGNER"; test -x "$ZIPALIGN"

          echo "--- aapt2 dump badging ---"
          "$AAPT2" dump badging "$APK" | tee badging.txt
          grep -E "^package: name='com.nova.gpspro'" badging.txt
          grep -E "^launchable-activity: name='com.nova.gpspro.MainActivity'" badging.txt
          if grep -Eiq "walkie|ptt" badging.txt; then
            echo "ERROR: walkie-talkie reference found in the packaged app metadata"; exit 1
          fi

          echo "--- aapt2 dump permissions ---"
          "$AAPT2" dump permissions "$APK" | tee permissions.txt
          for forbidden in RECORD_AUDIO MODIFY_AUDIO_SETTINGS NEARBY_WIFI_DEVICES CHANGE_WIFI_STATE FOREGROUND_SERVICE_MICROPHONE FOREGROUND_SERVICE_CONNECTED_DEVICE WAKE_LOCK POST_NOTIFICATIONS; do
            if grep -q "$forbidden" permissions.txt; then
              echo "ERROR: leftover Walkie-Talkie permission $forbidden"; exit 1
            fi
          done

          echo "--- aapt2 dump xmltree (manifest services) ---"
          "$AAPT2" dump xmltree "$APK" --file AndroidManifest.xml > manifest-tree.txt
          if grep -qi "PttService" manifest-tree.txt; then
            echo "ERROR: PttService still declared in the packaged manifest"; exit 1
          fi

          echo "--- zip integrity + alignment ---"
          unzip -tq "$APK"
          "$ZIPALIGN" -c -v 4 "$APK" | tail -n 5

          echo "--- apksigner verify ---"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee signature.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" signature.txt

      - name: Annotate failure diagnostics
        if: failure()
        run: |
          ERR=$(grep -E "e: |error:|FAILED|AssertionError|Exception|Caused by:" test.log lint.log build.log 2>/dev/null | head -n 14 | tr '\n' ' | ' | head -c 950)
          if [ -z "$ERR" ]; then ERR=$(tail -n 30 test.log lint.log build.log 2>/dev/null | tr '\n' ' | ' | head -c 950); fi
          echo "::error title=Diagnostics::$ERR"

      - name: Upload RMG-GPS-Pro-debug.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RMG-GPS-Pro-debug.apk
          path: app/build/outputs/apk/debug/RMG-GPS-Pro-debug.apk
          if-no-files-found: error

name: Build NOVA GPS PRO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests (theme contrast, GPS signal, existing suites)
        continue-on-error: true
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testDebugUnitTest 2>&1 | tee test.log

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee build.log

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            test.log
          if-no-files-found: warn

      - name: Post build log tail to commit comment on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Posting build log tail..."
          TAIL=$(tail -n 220 build.log 2>/dev/null | head -c 48000)
          if [ -z "$TAIL" ]; then TAIL="(no build.log)"; fi
          printf "❌ Build failed — build.log tail (run %s):\n\`\`\`\n%s\n\`\`\`\n" "${{ github.run_id }}" "$TAIL" > /tmp/body.txt
          cat /tmp/body.txt | head -n 30
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@/tmp/body.txt 2>&1 | head -n 50 || true
          echo "posted"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-GPS-PRO-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: Build NOVA GPS PRO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests (theme contrast, GPS signal, existing suites)
        continue-on-error: true
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testDebugUnitTest 2>&1 | tee test.log

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee build.log

      - name: Show build log on failure
        if: failure()
        run: |
          echo "=== BUILD LOG TAIL (300 lines) ==="
          tail -n 300 build.log || true
          echo "=== END BUILD LOG ==="

      - name: Create issue with build log
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Creating issue with build log..."
          TAIL=$(tail -n 400 build.log | head -c 90000)
          printf "%s" "$TAIL" > /tmp/tail.txt
          echo "TAIL size $(wc -c < /tmp/tail.txt)"
          # Create issue via gh api - body from file
          gh api repos/${{ github.repository }}/issues -f title="Build log ${{ github.sha }}" --raw-field body="$(cat /tmp/tail.txt | head -c 65000)" || echo "issue create failed"
          cat /tmp/tail.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-GPS-PRO-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

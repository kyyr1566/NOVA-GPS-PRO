name: Android build & unit tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# A newer run for the same branch / PR supersedes an older one.
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only token: the build only needs to read the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # Public license settings (Settings → Secrets and variables → Actions → Variables). Never a private key.
      # Unset on forks / PRs without them → the debug build is simply "not configured" (cannot activate anything).
      - name: Unit tests (debug)
        env:
          LICENSE_SERVER_BASE_URL: ${{ vars.LICENSE_SERVER_BASE_URL }}
          LICENSE_PUBLIC_KEY: ${{ vars.LICENSE_PUBLIC_KEY }}
          ACTIVATION_PUBLIC_KEY: ${{ vars.ACTIVATION_PUBLIC_KEY }}
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Unit tests (all variants)
        env:
          LICENSE_SERVER_BASE_URL: ${{ vars.LICENSE_SERVER_BASE_URL }}
          LICENSE_PUBLIC_KEY: ${{ vars.LICENSE_PUBLIC_KEY }}
          ACTIVATION_PUBLIC_KEY: ${{ vars.ACTIVATION_PUBLIC_KEY }}
        run: ./gradlew --no-daemon --stacktrace test

      - name: Build Debug APK
        env:
          LICENSE_SERVER_BASE_URL: ${{ vars.LICENSE_SERVER_BASE_URL }}
          LICENSE_PUBLIC_KEY: ${{ vars.LICENSE_PUBLIC_KEY }}
          ACTIVATION_PUBLIC_KEY: ${{ vars.ACTIVATION_PUBLIC_KEY }}
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: DIAG surface gradle errors
        if: failure()
        env:
          LICENSE_SERVER_BASE_URL: ${{ vars.LICENSE_SERVER_BASE_URL }}
          LICENSE_PUBLIC_KEY: ${{ vars.LICENSE_PUBLIC_KEY }}
          ACTIVATION_PUBLIC_KEY: ${{ vars.ACTIVATION_PUBLIC_KEY }}
        run: |
          ./gradlew --no-daemon --console=plain testDebugUnitTest > /tmp/gradle.log 2>&1 || true
          grep -nE "^e: |^w: .*license|error:|What went wrong|FAILED|Caused by|Unresolved|Exception" /tmp/gradle.log | head -25 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
          echo "::error::TAIL: $(tail -n 12 /tmp/gradle.log | tr '\n' '|' | cut -c1-900)"

      - name: Upload unit test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-GPS-PRO-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: Build NOVA GPS PRO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests (theme contrast, GPS signal, existing suites)
        continue-on-error: true
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testDebugUnitTest 2>&1 | tee test.log

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee build.log

      - name: Report build failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== BUILD.LOG (last 300 lines) ==="
          tail -n 300 build.log || true
          echo "=== posting to PR comment ==="
          LOG=$(tail -n 250 build.log | head -c 60000)
          # Find PR for this branch
          BRANCH="${GITHUB_REF#refs/heads/}"
          PR=$(gh pr list --state open --json number,headRefName --jq ".[] | select(.headRefName==\"$BRANCH\") | .number" | head -n1)
          if [ -n "$PR" ]; then
            gh api repos/${{ github.repository }}/issues/$PR/comments --field body="❌ Build failed on $BRANCH ($(git rev-parse --short HEAD)):
          \`\`\`
          $LOG
          \`\`\`" || true
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-GPS-PRO-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

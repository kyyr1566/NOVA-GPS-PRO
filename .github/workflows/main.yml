name: Build NOVA GPS PRO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests (theme contrast, GPS signal, existing suites)
        continue-on-error: true
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testDebugUnitTest 2>&1 | tee test.log

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee build.log

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            test.log
          if-no-files-found: warn

      - name: Push build log to ci-logs branch on failure
        if: failure()
        run: |
          echo "Pushing build log to ci-logs branch..."
          git config user.name "ci-bot"
          git config user.email "ci@bot.local"
          git fetch origin ci-logs 2>&1 | head -n 20 || true
          git checkout -B ci-logs 2>&1 | head -n 20
          mkdir -p ci-logs
          cp build.log ci-logs/build-${{ github.run_id }}.log 2>&1 | head -n 20 || echo "no build.log" > ci-logs/build-${{ github.run_id }}.log
          cp test.log ci-logs/test-${{ github.run_id }}.log 2>&1 | head -n 20 || true
          tail -n 300 build.log > ci-logs/tail-${{ github.run_id }}.txt 2>&1 || true
          git add ci-logs/ 2>&1 | head -n 20
          git commit -m "ci log ${{ github.run_id }} ${{ github.sha }}" 2>&1 | head -n 20 || true
          git push origin ci-logs --force 2>&1 | head -n 20 || true
          echo "pushed"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-GPS-PRO-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
